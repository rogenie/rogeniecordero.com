<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>All Brands Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#fff; --sunk:#f8f9fb; --line:#d9dee7; --fg:#131a2a; --muted:#5b6578;
  --accent:#2a4bd7; --up:#17794a; --down:#b3322a; --warn:#9a6a00;
  --high-bg:#fdecea; --med-bg:#fdf4dc;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e121b; --surface:#171d2a; --sunk:#131926; --line:#2a3345; --fg:#e8ecf4; --muted:#98a3b8;
  --accent:#8aa2ff; --up:#55cf92; --down:#ff8a80; --warn:#e2b548;
  --high-bg:#3a1f1f; --med-bg:#3a321a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:none;margin:0;padding:28px clamp(16px,3vw,40px) 64px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
h1{font:700 32px/1.1 var(--display);margin:0}
h2{font:700 20px/1.2 var(--display);margin:0}
h3{font:700 16px/1.25 var(--display);margin:0}
.sub,.muted{color:var(--muted)}
.sub{margin:6px 0 0;font-size:14px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px}
.kpi .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .big{font:500 30px/1.15 var(--mono);margin-top:4px}
.kpi .small{font-size:13px;color:var(--muted)}
.kpi.alert .big{color:var(--down)}
section{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
/* problems */
.pgroup{padding:14px 18px;border-top:1px solid var(--line)}
.pgroup:first-child{border-top:0}
.pgroup h3{display:flex;gap:10px;align-items:center}
.count{font:500 12px var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--muted)}
.prob{display:grid;grid-template-columns:118px 1fr;gap:4px 16px;padding:10px 12px;margin-top:8px;border-radius:8px;background:var(--med-bg)}
.prob.high{background:var(--high-bg)}
.prob .meta{font-size:12px;color:var(--muted);line-height:1.4}
.prob .tag{display:inline-block;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--warn)}
.prob.high .tag{color:var(--down)}
.prob .fix{font-size:13px;color:var(--muted);margin-top:2px}
.ok{padding:18px;color:var(--up)}
/* social table */
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:10px 14px;text-align:right;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:0;background:var(--sunk)}
th:first-child,td:first-child{text-align:left}
td .f{font:500 16px var(--mono)}
td .ch{font:12px var(--mono)}
td.na{color:var(--muted);font-size:13px}
tr.total td{background:var(--sunk);font-weight:600}
.badge{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
/* articles */
.pick{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.pick select{font:inherit;font-size:14px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 32px 7px 12px;min-width:220px;cursor:pointer}
.pick select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:5px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.streams{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
@media (max-width:620px){.streams{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.prob{grid-template-columns:1fr}}
.stream{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.stream .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.stream .cad{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{font:500 15px var(--mono);color:var(--fg)}
.stats .bad b{color:var(--down)}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.cols h4.bad{color:var(--down)}
li .why{display:block;font-size:12px;color:var(--muted)}
@media (max-width:620px){.cols{grid-template-columns:1fr}}
.cols h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:grid;grid-template-columns:52px 1fr auto;gap:8px;font-size:13.5px;line-height:1.35}
li .vc{font:12px var(--mono);color:var(--muted);padding-top:1px;text-align:right}
li .dt{font:12px var(--mono);color:var(--muted);padding-top:1px}
li.miss .ti{color:var(--down)}
li.today .ti::after{content:" · due today";color:var(--warn);font-size:12px}
.more{font-size:12px;color:var(--muted)}
.err{color:var(--down)}
footer{font-size:12px;color:var(--muted);line-height:1.6}

.brandbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;position:sticky;top:0;z-index:5}
.brandbar .pick select{font:700 18px var(--display);min-width:280px;padding:8px 36px 8px 12px}
.brandbar .sum{font-size:13px;color:var(--muted)}
.divider{border:0;border-top:2px solid var(--line);margin:4px 0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
td.pr{font:500 15px var(--mono)}td.pr.bad{color:var(--down)}td.pr.good{color:var(--up)}
.nets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line)}
.net{background:var(--surface);padding:14px 16px}
.net .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.net .f{font:500 26px/1.2 var(--mono);display:block;margin-top:2px}
.net .h{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>All Brands Dashboard</h1>
      <p class="sub" id="fresh">Loading…</p>
    </div>
  </header>

  <section>
    <div class="sechead"><h2>All brands</h2></div>
    <div class="kpis" id="kpis"></div>
  </section>

  <hr class="divider">

  <div class="brandbar">
    <label class="pick"><span>Brand</span> <select id="brandSel" aria-label="Brand"></select></label>
    <span class="sum" id="brandSum"></span>
  </div>

  <section>
    <div class="sechead"><h2>Problems</h2><span class="muted" style="font-size:13px">Failed or missing social posts and article publishes</span></div>
    <div class="panel" id="problems"></div>
  </section>

  <section>
    <div class="sechead"><h2>Website visits</h2><span class="muted" style="font-size:13px" id="visitSrc">GoatCounter</span></div>
    <div class="panel" id="visits" style="overflow:hidden"></div>
  </section>

  <section>
    <div class="sechead"><h2>Social following</h2><span class="muted" style="font-size:13px">Followers now · change over 7 and 30 days</span></div>
    <div class="panel" id="social" style="overflow:hidden"></div>
  </section>

  <section>
    <div class="sechead"><h2>Articles</h2></div>
    <div class="streams" id="streams"></div>
  </section>

  <footer id="foot"></footer>
</div>
<script>
const NETS=["TikTok","Facebook","YouTube","Instagram"];
const ORDER=["9nth Dimension","Teachings of Jesus","Natal Notes","ÆTAS","Tibi Mundum","Computatio","BookByte","Purogé","Pinoy Mobile Mechanic","thatmommatho"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n==null?"–":Number(n).toLocaleString("en-US");
const sign=n=>n==null?"":(n>0?"+":n<0?"−":"±")+Math.abs(n).toLocaleString("en-US");
const cls=n=>n>0?"up":n<0?"down":"flat";
const md=s=>{if(!s)return"";const d=new Date(s+"T12:00:00");return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})};
const when=s=>{const d=new Date(s);return isNaN(d)?s:d.toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})};
// GoatCounter sites. Computatio and BookByte share one counter (paths start with the host).
const GC={"ÆTAS":{code:"parvaregina",site:"aetasliveforever.com",note:"Counter also holds the old parvaregina.com visits."},
  "Tibi Mundum":{code:"tibimundum",site:"tibimundum.com"},
  "Computatio":{code:"computatio",site:"computatio.io",host:true,shared:"BookByte"},
  "BookByte":{code:"computatio",site:"bookbytellc.com",host:true,shared:"Computatio"},
  "Pinoy Mobile Mechanic":{code:"pinoymobilemechanic",site:"pinoymobilemechanic.com"}};
const NOVISIT={"9nth Dimension":"9nthdimension.com uses Google Analytics, which this page can't read.","Purogé":"puroge.com has no visit counter yet."};
const isoDay=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString("en-CA",{timeZone:"America/Los_Angeles"})};
const gcCache={};
function gcCount(code,path,days){
  const k=code+"|"+path+"|"+(days||"");if(gcCache[k])return gcCache[k];
  const qs=days?`?start=${isoDay(days)}&end=${isoDay(0)}`:"";
  return gcCache[k]=fetch(`https://${code}.goatcounter.com/counter/${encodeURIComponent(path)}.json${qs}`)
    .then(r=>r.status===404?0:r.ok?r.json().then(j=>Number(String(j.count).replace(/[^0-9]/g,""))||0):null).catch(()=>null);
}
const pagePath=(g,url)=>{try{const u=new URL(url);return g.host?u.host+u.pathname:u.pathname}catch(e){return null}};
const byOrder=(a,b)=>(ORDER.indexOf(a)+1||99)-(ORDER.indexOf(b)+1||99);

function acctNums(a){
  const h=a.history||{},ds=Object.keys(h).sort();if(!ds.length)return{};
  const last=ds[ds.length-1],now=h[last],lastD=new Date(last+"T12:00:00");
  const back=days=>{const t=new Date(lastD);t.setDate(t.getDate()-days);const iso=t.toISOString().slice(0,10);
    let best=ds[0];for(const d of ds){if(Math.abs(new Date(d)-new Date(iso))<Math.abs(new Date(best)-new Date(iso)))best=d}return h[best]};
  return{now,d7:now-back(7),d30:now-back(30),asOf:last};
}

async function load(){
  const get=u=>fetch(u+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null);
  const [art,soc]=await Promise.all([get("articles.json"),get("social.json")]);
  render(art||{streams:[]},soc||{brands:[],problems:[]});
}

function render(art,soc){
  $("#fresh").innerHTML=`Articles checked ${esc(when(art.generated))} · Social checked ${esc(when(soc.generated))} · Pacific time`;

  // ---------- gather per-brand data ----------
  const probs=[...(soc.problems||[])];
  for(const s of art.streams){
    if(s.error){probs.push({brand:s.brand,date:art.today,network:s.stream,severity:"medium",kind:"check",text:`Couldn't read the ${s.stream.toLowerCase()} calendar: ${s.error}`});continue}
    for(const p of s.problems||[]) probs.push({brand:s.brand,date:p.date,network:s.stream,severity:p.status==="missed"?"high":"medium",kind:p.status,
      text:(p.slot?p.title:(p.status==="missed"?"Didn't go live: ":"Held: ")+p.title)+(p.note?` (${p.note})`:"")});
  }
  const B={};
  const ensure=n=>B[n]=B[n]||{name:n,accounts:[],personal:false,streams:[],probs:[],f:0,f7:0,f30:0,hasSoc:false,pub7:0,queued:0,live:0};
  for(const b of soc.brands||[]){const x=ensure(b.brand);x.personal=!!b.personal;x.note=b.note;
    for(const a of b.accounts){const v=acctNums(a);x.accounts.push({...a,...v});x.f+=v.now;x.f7+=v.d7;x.f30+=v.d30;x.hasSoc=true}}
  for(const s of art.streams){const x=ensure(s.brand);x.streams.push(s);if(s.counts){x.pub7+=s.counts.published_7d;x.queued+=s.counts.queued;x.live+=s.counts.published}}
  for(const p of probs)ensure(p.brand).probs.push(p);
  const names=Object.keys(B).sort(byOrder);
  const biz=names.map(n=>B[n]).filter(x=>!x.personal);
  const sum=k=>biz.reduce((t,x)=>t+x[k],0);

  // ---------- top: all brands ----------
  const high=probs.filter(p=>p.severity==="high").length;
  $("#kpis").innerHTML=`
    <div class="kpi"><div class="lab">Followers, business brands</div><div class="big num">${fmt(sum("f"))}</div><div class="small"><span class="${cls(sum("f7"))}">${sign(sum("f7"))}</span> in 7 days · <span class="${cls(sum("f30"))}">${sign(sum("f30"))}</span> in 30</div></div>
    <div class="kpi"><div class="lab">Website visits, all time</div><div class="big num" id="kv">…</div><div class="small" id="kv7">tracked sites</div></div>
    <div class="kpi"><div class="lab">Articles live, last 7 days</div><div class="big num">${sum("pub7")}</div><div class="small">across ${art.streams.length} publishing streams</div></div>
    <div class="kpi"><div class="lab">Articles in queue</div><div class="big num">${sum("queued")}</div><div class="small">scheduled, not yet live</div></div>
    <div class="kpi ${probs.length?"alert":""}"><div class="lab">Open problems</div><div class="big num">${probs.length}</div><div class="small">${high} urgent</div></div>`;
  (async()=>{const codes=[...new Set(Object.values(GC).map(g=>g.code))];
    const all=await Promise.all(codes.map(c=>gcCount(c,"TOTAL")));const wk=await Promise.all(codes.map(c=>gcCount(c,"TOTAL",7)));
    const ok=all.filter(v=>v!=null);
    $("#kv").textContent=ok.length?fmt(ok.reduce((a,b)=>a+b,0)):"—";
    $("#kv7").textContent=ok.length?`${fmt(wk.filter(v=>v!=null).reduce((a,b)=>a+b,0))} in 7 days · ${ok.length} of ${codes.length} sites' counters`:"couldn't read the visit counters";})();

  // ---------- brand picker ----------
  let pick=new URLSearchParams(location.search).get("brand");
  if(!B[pick])pick=names.find(n=>B[n].probs.length)||names[0];
  $("#brandSel").innerHTML=names.map(n=>`<option value="${esc(n)}"${n===pick?" selected":""}>${esc(n)}</option>`).join("");
  const choose=n=>{pick=n;$("#brandSel").value=n;const u=new URL(location);u.searchParams.set("brand",n);history.replaceState(null,"",u);drawBrand()};
  $("#brandSel").onchange=e=>choose(e.target.value);

  const kindLabel={failed:"Social post failed",empty:"No social posts",missed:"Article missed",held:"Article held",check:"Check failed"};
  function drawBrand(){
    const x=B[pick];
    $("#brandSum").innerHTML=[x.hasSoc?`${fmt(x.f)} followers`:null,x.streams.length?`${x.live} articles live · ${x.queued} queued`:null,`${x.probs.length} problem${x.probs.length===1?"":"s"}`].filter(Boolean).join(" · ");
    // problems
    const list=[...x.probs].sort((a,b)=>(a.severity===b.severity?0:a.severity==="high"?-1:1)||String(b.date).localeCompare(a.date));
    $("#problems").innerHTML=list.length?`<div class="pgroup">${list.map(p=>`
      <div class="prob ${p.severity==="high"?"high":""}">
        <div class="meta"><span class="tag">${esc(kindLabel[p.kind]||p.kind)}</span><br>${esc(md(p.date))} · ${esc(p.network)}</div>
        <div><div>${esc(p.text)}</div>${p.fix?`<div class="fix">${esc(p.fix)}</div>`:""}</div>
      </div>`).join("")}</div>`:`<div class="ok">No problems for ${esc(pick)}. Every due article is live and no social post failed.</div>`;
    // visits
    const g=GC[pick];
    if(!g){$("#visits").innerHTML=`<div style="padding:18px;color:var(--muted)">${esc(NOVISIT[pick]||"No website for this brand.")}</div>`;$("#visitSrc").textContent=""}
    else{
      $("#visitSrc").innerHTML=`GoatCounter · <a href="https://${g.code}.goatcounter.com">open full stats</a>`;
      $("#visits").innerHTML=`<div class="nets">${[["All time",0],["Last 30 days",30],["Last 7 days",7]].map(([l,d])=>`<div class="net"><div class="lab">${l}</div><span class="f" data-v="${d}">…</span></div>`).join("")}</div>
        <div id="vnote" style="padding:10px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)">${g.shared?`${esc(g.site)} shares one counter with ${esc(g.shared)}, so these totals cover both sites. Per-article counts below are this site only.`:esc(g.note||g.site)}</div>`;
      const me=pick;
      document.querySelectorAll("#visits [data-v]").forEach(async el=>{const d=+el.dataset.v;const v=await gcCount(g.code,"TOTAL",d||undefined);
        if(pick!==me)return;el.textContent=v==null?"—":fmt(v);
        if(v==null&&d===0)$("#vnote").innerHTML=`Couldn't read the ${esc(g.code)} counter. If this keeps showing, open GoatCounter → Settings → Site settings and turn on “Allow adding visitor counts on your website.”`});
    }
    // social
    $("#social").innerHTML=x.hasSoc?`<div class="nets">${NETS.map(n=>x.accounts.find(a=>a.network===n)).filter(Boolean).map(a=>`
      <div class="net"><div class="lab">${esc(a.network)}</div><a class="f" href="${esc(a.url)}">${fmt(a.now)}</a>
        <div class="h">${esc(a.handle)} · as of ${esc(md(a.asOf))}</div>
        <div class="ch num"><span class="${cls(a.d7)}">${sign(a.d7)}</span> 7d · <span class="${cls(a.d30)}">${sign(a.d30)}</span> 30d</div></div>`).join("")}
      <div class="net" style="background:var(--sunk)"><div class="lab">Total</div><span class="f">${fmt(x.f)}</span><div class="h">all networks</div>
        <div class="ch num"><span class="${cls(x.f7)}">${sign(x.f7)}</span> 7d · <span class="${cls(x.f30)}">${sign(x.f30)}</span> 30d</div></div></div>`
      :`<div class="empty" style="padding:18px;color:var(--muted)">${esc(x.note||"No social accounts")} for ${esc(pick)}.</div>`;
    // articles
    $("#streams").innerHTML=x.streams.length?x.streams.map(s=>{
      if(s.error)return`<div class="panel stream"><h3>${esc(s.stream)}</h3><div class="err">${esc(s.error)}</div></div>`;
      const c=s.counts;
      const li=(i,link)=>`<li class="${i.status==="missed"?"miss":i.status==="due_today"?"today":""}"><span class="dt">${esc(md(i.date))}</span><span class="ti">${link&&i.url?`<a href="${esc(i.url)}">${esc(i.title)}</a>`:esc(i.title)}</span><span class="vc"${link&&i.url&&GC[s.brand]?` data-u="${esc(i.url)}" title="visits"`:""}></span></li>`;
      return`<div class="panel stream">
        <div class="top"><h3>${esc(s.stream)}</h3><span class="cad">${esc(s.cadence||"")}</span></div>
        <div class="stats"><span><b>${c.published}</b> live</span><span><b>${c.published_7d}</b> this week</span><span><b>${c.queued}</b> in queue</span>${c.missed?`<span class="bad"><b>${c.missed}</b> missed</span>`:""}${c.held?`<span class="bad"><b>${c.held}</b> held</span>`:""}</div>
        <div class="cols">
          <div><h4>Published</h4><ol>${s.published.map(i=>li(i,true)).join("")||'<li class="more">None yet</li>'}</ol>${c.published>s.published.length?`<div class="more">+ ${c.published-s.published.length} older</div>`:""}</div>
          <div><h4 class="${s.problems.length?"bad":""}">Missed${s.problems.length?` (${s.problems.length})`:""}</h4><ol>${[...s.problems].reverse().map(i=>`<li class="miss"><span class="dt">${esc(md(i.date))}</span><span class="ti">${esc(i.slot?"Nothing went live":i.title)}<span class="why">${i.status==="held"?"Held"+(i.note?": "+esc(i.note):""):"Scheduled, not published"}</span></span><span></span></li>`).join("")||'<li class="more"><span></span><span>None missed</span></li>'}</ol></div>
          <div><h4>In queue</h4><ol>${s.queue.map(i=>li(i,false)).join("")||'<li class="miss"><span></span><span class="ti">Queue is empty</span></li>'}</ol>${c.queued>s.queue.length?`<div class="more">+ ${c.queued-s.queue.length} more</div>`:""}</div>
        </div></div>`}).join(""):`<div class="panel" style="padding:18px;color:var(--muted)">${esc(pick)} has no article publishing.</div>`;
    const gg=GC[pick],me2=pick;
    if(gg)document.querySelectorAll("#streams .vc[data-u]").forEach(async el=>{const pth=pagePath(gg,el.dataset.u);if(!pth)return;
      const v=await gcCount(gg.code,pth);if(pick===me2&&v!=null)el.textContent=fmt(v)+" views"});
  }
  drawBrand();

  $("#foot").innerHTML=`Visits come from each site's GoatCounter. Followers come from Metricool's daily counts. Articles come from each site's own publishing calendar, read without changing anything. A "missed" article is one scheduled before today that isn't live.`;
}
load();
</script>
</body>
</html>
